schema_version = "1.0.0"

id = "blender_bakelab"
version = "3.0.0"
name = "BakeLab"
tagline = "Bake textures with automatic image and material setup"
maintainer = "Tabzy"
type = "add-on"

website = "https://github.com/CloudyTabzy/Blender-BakeLab2"

tags = ["Bake", "Material", "Render"]

blender_version_min = "4.2.0"
blender_version_max = "5.2.99"

# Save mode writes the baked images to disk
permissions = { files = "Save baked textures to disk" }

license = [
  "SPDX:GPL-3.0-or-later",
]

copyright = [
  "2024 Tabzy",
]

[build]
# Blender's defaults, plus repo-only files the add-on doesn't use
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.ruff_cache/",
  "/*.zip",
  "/.gitignore",
  "/*.png",
  "/TESTING.md",
  "/tests/",
  "/dist/",
]
